<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculadora">
        <button id="toggleCientifica" class="btn-cientifica">
            ƒx Científica
        </button>
        <div id="pantalla" class="pantalla">0</div>
        <div id="cientifica" class="cientifica">
            <button class="btn" onclick="agregar('Math.sqrt(')">√</button>
            <button class="btn" onclick="borrarUltimo()">⌫</button>
            <button class="btn" onclick="agregar('Math.sin(')">sin</button>
            <button class="btn" onclick="agregar('Math.cos(')">cos</button>
            <button class="btn" onclick="agregar('Math.tan(')">tan</button>
            <button class="btn" onclick="agregar('Math.PI')">π</button>
            <button class="btn" onclick="agregar('Math.E')">e</button>
            <button class="btn" onclick="agregar('Math.log10(')">log</button>
            <button class="btn" onclick="agregar('Math.log(')">ln</button>
            <button class="btn" onclick="agregar('**2')">x²</button>
            <button class="btn" onclick="agregar('**')">xʸ</button>
            <button class="btn" onclick="agregar('%')">%</button>
            <button class="btn" onclick="agregar('(')">(</button>
            <button class="btn" onclick="agregar(')')">)</button>
        </div>
        <div class="botones">
            <button class="btn" onclick="limpiar()">C</button>
            <button class="btn" onclick="agregar('/')">/</button>
            <button class="btn" onclick="agregar('*')">*</button>
            <button class="btn" onclick="agregar('-')">-</button>
            <button class="btn" onclick="agregar('7')">7</button>
            <button class="btn" onclick="agregar('8')">8</button>
            <button class="btn" onclick="agregar('9')">9</button>
            <button class="btn suma" onclick="agregar('+')">+</button>
            <button class="btn" onclick="agregar('4')">4</button>
            <button class="btn" onclick="agregar('5')">5</button>
            <button class="btn" onclick="agregar('6')">6</button>
            <button class="btn" onclick="agregar('1')">1</button>
            <button class="btn" onclick="agregar('2')">2</button>
            <button class="btn" onclick="agregar('3')">3</button>
            <button class="btn equal" onclick="calcular()">=</button>
            <button class="btn zero" onclick="agregar('0')">0</button>
            <button class="btn" onclick="agregar('.')">.</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
